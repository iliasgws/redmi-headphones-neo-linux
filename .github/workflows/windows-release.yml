name: Windows preview release
on:
  push:
    tags: ['windows-v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64 app
        shell: pwsh
        run: dotnet publish windows/NeoWindows/NeoWindows.csproj -c Release -r win-x64 --self-contained true -o windows-build
      - name: Package release
        shell: pwsh
        run: |
          Copy-Item windows/README.md windows-build/README.md
          Copy-Item ASSETS.md windows-build/ASSETS.md
          Compress-Archive -Path windows-build/* -DestinationPath REDMI-Neo-Windows11-x64.zip
      - name: Create preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" REDMI-Neo-Windows11-x64.zip --prerelease --title "Windows 11 preview ${{ github.ref_name }}" --notes "Experimental Windows 11 build. Pair and connect the Neo in Windows Bluetooth settings, then open the app and select Connect controls. ANC and device behavior require verification on Windows with the Neo. Extract the complete ZIP before running REDMI-Neo.exe. See ASSETS.md for animation provenance."
